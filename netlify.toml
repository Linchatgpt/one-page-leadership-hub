[build]
  command = "python3 scripts/build_article_hub.py"
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/generate-learning-page"
  to = "/.netlify/functions/generate-learning-page"
  status = 200

[[redirects]]
  from = "/api/generate-audio-script"
  to = "/.netlify/functions/generate-audio-script"
  status = 200

[[redirects]]
  from = "/api/generate-summary-audio"
  to = "/.netlify/functions/generate-summary-audio"
  status = 200

[[redirects]]
  from = "/api/publish-article"
  to = "/.netlify/functions/publish-article"
  status = 200

[[redirects]]
  from = "/api/save-draft"
  to = "/.netlify/functions/api?route=save-draft"
  status = 200

[[redirects]]
  from = "/api/list-drafts"
  to = "/.netlify/functions/list-drafts"
  status = 200

[[redirects]]
  from = "/api/delete-draft"
  to = "/.netlify/functions/api?route=delete-draft"
  status = 200

[[redirects]]
  from = "/api/generate-article-image"
  to = "/.netlify/functions/generate-article-image"
  status = 200

[[redirects]]
  from = "/api/article-image"
  to = "/.netlify/functions/article-image"
  status = 200

[[redirects]]
  from = "/api/render-preview"
  to = "/.netlify/functions/render-preview"
  status = 200

[[redirects]]
  from = "/api/list-published"
  to = "/.netlify/functions/list-published"
  status = 200

[[redirects]]
  from = "/article"
  to = "/.netlify/functions/article"
  status = 200

[build.environment]
  PYTHON_VERSION = "3.13"
